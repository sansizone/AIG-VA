function page_load(event) {
	try{
		XwingObject();

		
		$lbl_ban_keyword.setValue(parent.ban_keyword);
		//vrs select 초기화
		parent.vrsRowNum="0";
		if(parent.ban_cd == ""){
			$lbl_subtitle2.setValue("금칙어검출결과(전체)");
			$pnl_ban_keyword.setVisible(false);
			$DS_BAN_RES.clearData();
			$DS_BAN_ANS.clearData();
		}else{
			$lbl_subtitle2.setValue("금칙어검출결과");
			$pnl_ban_keyword.setVisible(true);
		}
		
		//청약정보 탭에 한해 엑셀다운 권한 설정
		parent.excelDownAuthSTT($btn_excel,false,false);
		
		getBanDetailRes();
	}catch(e){
		xwing.Dialog.alert(e);
	}
}

function getBanDetailRes(){
	var opt = {
			reqId: "getBanRes",
			url: v_url,
			param: {
				_sqlName  : 'oba.oba010t2.getBanRes.sel',
				BAN_CD : parent.ban_cd,
				CED_NO : parent.ced_no
			},
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}

function getBanDetailStt(){	
	var opt = {
			reqId: "getDetailStt",
			url: "service::msens.xcron.hansol.sttEncryptWebaction.do",
			param: {
				_sqlName  : 'oba.oba010t4.getBanDetailRes.sel'
				,TYPE : 'D'
				,BAN_CD : parent.ban_cd
				,CED_NO : parent.ced_no
			},
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}

/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getBanRes":
			$DS_BAN_RES.setData(res.DS_BAN_RES.column, res.DS_BAN_RES.record);
			getBanDetailStt();
		break;
		
		case "getDetailStt" :
			$DS_BAN_ANS.setData(res.DS_RES.column, res.DS_RES.record);
			
			var idxs = $DS_BAN_ANS.searchRow("[BAN_CD =='"+$DS_BAN_RES.getValue(0,"BAN_CD")+"']");
			
			for(var i =0; i< idxs.length; i++){
				$("#grd_ban_stt .xw-datagrid-area-body table tbody tr[cy='"+idxs[i]+"']").addClass("select");
			}
			
			$DS_BAN_ANS.setCursor(idxs[0]);
			break;
			
		case "btnExcelClick":
			$DS_EXCEL.clear();
			$DS_EXCEL.setData(res.DS_RES.column, res.DS_RES.record);
			
			//TODO: ban_cd 중복 시 빈칸으로 변경하는 작업
			for(var i=1; i<$DS_EXCEL.size(); i++){
				var bef_ban_cd = $DS_EXCEL.getValue(i-1,"BAN_CD");
				var cur_ban_cd = $DS_EXCEL.getValue(i,"BAN_CD");
				
				if(bef_ban_cd == cur_ban_cd){
					$DS_EXCEL.setValue(i,"BAN_KEYWORD","");
					$DS_EXCEL.setValue(i,"BAN_YN","");
					$DS_EXCEL.setValue(i,"BAN_CNT","");
				}
			}
			
			if(Xwing.getDataset('DS_EXCEL').size() > 0) {
				Xwing.getDataGrid('grd_excel').exportData('금칙어검출결과', '../jsp/export2.jsp', true); 
			} else {
				xwing.Dialog.alert("출력할 금칙어 검출결과가 없습니다.");
			}
			
			break;
	}
}

function grd_ban_stt_click(event) {
	var nCell = event.cell._getColIndex();
	
	var selected = document.querySelectorAll("#grd_ban_stt .select");
	for(var i=0, len=selected.length; i<len; i ++){
		selected[i].classList.remove("select");
	}
	
	$("#grd_ban_stt .xw-datagrid-area-body table tbody tr[cy='"+event.rowIdx+"']").addClass("select");
	
	if(nCell == 0){
		rec_key =  $DS_BAN_ANS.getValue(event.rowIdx,'UCID');
		call_time = $DS_BAN_ANS.getValue(event.rowIdx,'UCID_DATE');
		file_path = $DS_BAN_ANS.getValue(event.rowIdx,'FILE_FULL_PATH');
		if(parent.selected_ucid != rec_key){
			parent.load_player(rec_key,call_time,'L', file_path);
			parent.selected_ucid = rec_key;
			parent.cmb_ucid_date_change2(rec_key);
		}
		
	}else if(nCell == 1){
		var selectedRec = $DS_BAN_ANS.getValue(event.rowIdx,'UCID');
		var selectedTime = $DS_BAN_ANS.getValue(event.rowIdx,'UCID_DATE');
		var selectedFile = $DS_BAN_ANS.getValue(event.rowIdx,'FILE_FULL_PATH');
		
		if(parent.selected_ucid != '' && parent.selected_ucid != selectedRec){

			return;

			var start_point = $DS_BAN_ANS.getValue(event.rowIdx,'START_TIME');
			parent.seekToSTT(start_point);
		}
		
		/*if(selectedRec != rec_key && selectedTime != call_time){

}
/* ***********************************************************

function stt_del_alpha_num_expr(cellObj,rowIdx) {
	var opt = {};
	var sent = $DS_BAN_ANS.getValue(rowIdx, "STT_SENT");
	//sent.replace('\|',''); --이건 쿼리에서 제거
	sent = sent.replace(/[A-Za-z0-9]/gi,""); //한글만
	opt['value'] = sent.replace(/(^\s*)|(\s*$)/gi, ""); //앞 공백제거
	
	if(duplicateIdx.length > 0){
		for(var i=0, len=duplicateIdx.length; i<len; i++){
			
			if(duplicateIdx[i]==rowIdx){
				opt['bgcolor'] = "#d8e9ee";
			}else{
				opt['bgcolor'] = "#fff";
			}
		}
	}
	
	return opt;
}

function setColor2(cellObj,rowIdx) {
	var val={};
	
	if($DS_BAN_ANS.getValue(rowIdx-1,"UCID") != $DS_BAN_ANS.getValue(rowIdx,"UCID")){
		val['bgimage'] = "../images/icon_notice.png";
		val['bgimagerepeat'] = "no-repeat";
		val['bgimagealign'] = "center center";
	}

	return val;
}

function expr_excel_dateTime(cellObj,rowIdx) {
	var opt = {};
	var dsName="DS_EXCEL";

	var datetime = eval("$"+dsName+".getValue(rowIdx,'UCID_DATE')");
	
	if(datetime == null || datetime == '')
		return opt;
	
	var yyyy = datetime.substr(0,4);
	var MM = datetime.substr(4,2);
	var dd = datetime.substr(6,2);
	var hh =datetime.substr(8,2);
	var mm =datetime.substr(10,2);
	var ss =datetime.substr(12,2);

	opt=yyyy+"-"+MM+"-"+dd+" "+hh+":"+mm+":"+ss;
	return opt;
}
