/***********************************************************************

function page_load(event) {
	try{
		XwingObject();
		var query = location.search.substring(1);
		
		var parameters = {};
		var keyValues = query.split(/&/);
		for (var prop in keyValues) {
		    var keyValuePairs = keyValues[prop].split(/=/);
		    var key = keyValuePairs[0];
		    var value = keyValuePairs[1];
		    parameters[key] = value;
		}
	
		ced_no= parameters['ced_no'];
		if(ced_no.indexOf('?') != -1){
			ced_no = ced_no.slice(0,-1);	
		}
		
		$lbl_ced_no.setValue(ced_no);
	
		tab_idx= parameters['tab_idx'];
		if(tab_idx === undefined) tab_idx = 0;

		user_grade=parameters['user_grade']; //tm 연동
		if(user_grade === undefined){
			user_grade = opener.top.global.G_USER_GRADE;
		}
		//alert(user_grade);
		
		user_id = parameters['user_id'] ; //tm 연동
		if(user_id === undefined){
				user_id = opener.top.global.G_USER_ID;
		}
		pop_yn=parameters['pop_yn']; //tm 연동
		if(pop_yn === undefined){
			pop_yn = "Y";
			dtTimeStamp('0',"Y");
		}
		
		getUserDeptCd();
		//f_getGradeAuth();
		getUserGroupCd();
		getUcid();
		init_player();
		
		
	}catch(e){
		xwing.Dialog.alert(e);
	}
}

function lbl_tab_action(lbl,page){
	for(var i = 1; i<7;i++){
		//if(i==2) continue;
		//if(i==4) continue; 
		if('lbl_sub'+i != lbl){
			Xwing.getLabel('lbl_sub'+i).setFontweight('normal');
			Xwing.getLabel('lbl_sub'+i).setBgcolor('');
			Xwing.getLabel('lbl_sub'+i).setFontcolor('');
		}else{
			Xwing.getLabel(lbl).setFontweight('bold');
			Xwing.getLabel(lbl).setBgcolor('#58728d');
			Xwing.getLabel(lbl).setFontcolor('#fff');
		}
	}

	}else{

function init_player(){
	
	browserCheck();
	
	if(browser == "ie") $pan_player.setUrl('../PLY_IE/init.html'); //player 초기화 상태로 set
	else if(browser == "chrome") $pan_player.setUrl('../player_html5/init.html'); //player 초기화 상태로 set

}

function load_player(rec_key, start_time,log_gb, file_path,ced_no){
	
	log_gb = log_gb == undefined ? 'L' : log_gb;
	ced_no = $lbl_ced_no.getValue();
	
	var param={
			rec_key: rec_key,
			start_time : start_time,
			log_gb:log_gb,
			file_path : file_path,
			ced_no : ced_no
			
	};
	play(param, 'pan_player', 'N');

	//청약팝업에서만 플레이어영역 x축에 scroll만듬
	$('iframe').load(function(){
			$('iframe').contents().find("head").append($("<style type='text/css'> html { overflow-x:scroll !important;}</style>"));
	});
	
}

function seekToSTT(start_point){
	var elem = document.getElementById("if::pan_player");

		elem.contentWindow.sttJump(start_point);
	}else{

}

/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
	case "f_getGradeAuth":
		$DS_GRADEAUTH.setData(res.SYS001.column, res.SYS001.record);
		$DS_GROUPAUTH.setData(res.SYS011.column, res.SYS011.record);
		$DS_GRADEAUTH_STT.setData(res.SYS151.column, res.SYS151.record);
		if(tab_idx == 0){
			lbl_sub1_click();
		}else if(tab_idx == 1){
			lbl_sub2_click();
		}

		/************로그 쌓일 때****************
		 * 화면 'X' 닫기
		 * 화면 새로고침
		 * 세션로그아웃 상태에서 서비스 호출 -> session_timeout.jsp
		 * 세션 로그아웃 상태에서 팝업 Close 'X' 버튼 -> session_timeout.jsp
		 *	Alt+F4로 화면 닫기 
		 * ***************************/
		$(window).on('beforeunload', function(e){	//팝업으로 들어오는 경우는 어차피 세션 로그아웃 되니까 새로고침 안막아도됨.
				if(workStatFunc.nowStat == '0'){
					setWorkStat("N");
					alert("업무를 종료합니다."); //얘가 있어야 param null 오류가 안남... ㅇㅅㅇ;;..
				}
				if(pop_yn == "Y"){
					dtTimeStamp('0',"N");
					unload_logout();
				}
		});
		break;	
	case "getUcid":
			$DS_META.setData(res.DS_META.column, res.DS_META.record);
			$DS_UCID.setData(res.DS_UCID.column, res.DS_UCID.record);
			$DS_DURA.setData(res.DS_DURA.column, res.DS_DURA.record);
			if($DS_UCID.size() == 0){ // sponsor에도 없는 설계
				xwing.Dialog.alert("해당 설계건이 존재하지 않습니다.");
				return;
			}else{
				getReAnlStat(); 
			}
			break;
	case "getUserGroupCd":
		user_group_cd = res.DS_LIST.record[0]+"";
		
		if(res.DS_WORK_STAT.record[0] != undefined){
			workStatFunc.nowStat = res.DS_WORK_STAT.record[0]+"";
			btn_work_stat_click();
		}
		break;
		
	case "getUserDeptCd":
		var is_ga  = res.DS_DEPT_CD.record[0]+"";
		if(is_ga=="Y")
				user_dept_cd = "Agent";
		else
			user_dept_cd = "TM";
		f_getGradeAuth();
		break;
		
	case "getReAnlStat":
		$DS_INFO.setData(res.DS_LIST.column, res.DS_LIST.record);
		if($DS_INFO.size()>0){
			if($DS_INFO.getValue(0,"RE_ANL_YN") == "TRUE"){
				xwing.Dialog.alert("추가 콜이 발생히여 재분석 중입니다.");
			}
		}
		
		break;		
	case "LOGOUT_CHK":
		unloadFlag = false;
		window.self.close();
		break;

		default: break;	
	}
}

function btn_work_stat_click(event) {
	
	if(event != null){
		workStatFunc.preStat = workStatFunc.nowStat;
		workStatFunc.nowStat = event.source._attr.id;
		workStatFunc.nowStat =workStatFunc.nowStat.replace(/[^0-9]/gi,'');
	}
	
	for(var i = 0, len = workStatFunc.stat.length, image="",statName=""; i< len; i++){
		statName = eval("workStatFunc.stat["+i+"]");
		if(i == workStatFunc.nowStat && workStatFunc.preStat != workStatFunc.nowStat){
			image =eval("workStatFunc.stat"+i+"_image");
			eval("$btn_work_stat"+i+".setValue('"+statName+"종료');");
			eval("$btn_work_stat"+i+".setIcon('../images/"+image+"');");
		}else{
			eval("$btn_work_stat"+i+".setValue('"+statName+"시작');");
			eval("$btn_work_stat"+i+".setIcon('../images/"+workStatFunc.non_image+"');");
		}
			
	}

	if(event != null) setWorkStat("Y");
	if(workStatFunc.preStat == workStatFunc.nowStat) workStatFunc.nowStat = ''; //TOGGLE 스텟 초기화
}

function setWorkStat(open){
	var opt = {

				USER_ID : user_id
				,WORK_GUBUN : workStatFunc.nowStat
				,LOG_GB : "B" //BUTTON
				,START_YN : open
			}
	};
	Xwing.request(opt, function(){
		
	});
	
}


//엑셀버튼아이디, visible여부, main의 top볼수있는지 여부
function excelDownAuthSTT(btnId,v,main){
	v = v == undefined? true : v;
	main = main == undefined? true : main;
	var downPossible = "N";
	if(main){
		if(top.$DS_GRADEAUTH_STT.indexOfRow("CODENAME",global("G_USER_ID")) > -1)
			downPossible = top.$DS_GRADEAUTH_STT.getValue(top.$DS_GRADEAUTH_STT.indexOfRow("CODENAME",global("G_USER_ID")),"USEYN");
	}else{
		if((parent.user_id != null) && parent.$DS_GRADEAUTH_STT.indexOfRow("CODENAME",parent.user_id)> -1)
			downPossible = parent.$DS_GRADEAUTH_STT.getValue(parent.$DS_GRADEAUTH_STT.indexOfRow("CODENAME",parent.user_id),"USEYN");
	}
	if(downPossible == "Y"){
		btnId.setEnabled(true);
	}else{
		btnId.setEnabled(false);
		if(!v){
			btnId.setVisible(false);
		}
	}

}
