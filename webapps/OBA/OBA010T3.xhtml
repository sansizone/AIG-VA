function f_codebook_sel() {
	var param = {
			cmd : "getCodes",
			codeType : "SYS105,VSS190",
			useyn : "Y"
		};
		var opt = {
			reqId : "f_codebook_sel",
			url : "service::cs.com.codeutil.do",
			param : param
		};
		Xwing.request(opt, callback);
}


function getCtraRes(){
	var opt = {

			param: {

				,CED_NO : parent.ced_no
			},
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}

function getVrsDetailRes(){
	//현재 stt_sent를 기준으로 start_time을 가져오고 있는데, 추후에 stt_sent_id를 기준으로 start_time, stt_sent 가져오는걸로 수정해야됨!!

				,CTRA_INSA_CLCD : $cmb_ctra.getValue()
			},
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);

}

function getVrsDetailStt(){

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case "f_codebook_sel":
			$DS_SYS105.setData(res.SYS105.column, res.SYS105.record);
			$DS_VSS190.setData(res.VSS190.column, res.VSS190.record);
//			var help="※계피구분코드 ";
//			for(var i=0, len = $DS_SYS105.size(); i<len; i++){
//				help += ' '+$DS_SYS105.getValue(i,"CODEID")+":"+$DS_SYS105.getValue(i,"CODENAME");
//			}
//			$lbl_help.setValue(help);
//			$lbl_help.setWidth(50+$lbl_help.getValue().length*6);

		break;

		case "getCtraRes":
			$DS_SCRIPT_RES_CTRA.setData(res.DS_SCRIPT_RES_CTRA.column, res.DS_SCRIPT_RES_CTRA.record);
			$DS_SCRIPT_RES_SCLF.setData(res.DS_SCRIPT_RES_SCLF.column, res.DS_SCRIPT_RES_SCLF.record);
			
		
			
			if(parent.sclf_cd == ""){
				$cmb_ctra.setItemindex("0");
				$DS_SCRIPT_RES_SCLF.filter("[CTRA_INSA_CLCD =='"+$cmb_ctra.getValue()+"']");
				lbl_sclfs.setItemindex("0");		
			}else{
				$cmb_ctra.setValue(parent.cic);
				//$DS_SCRIPT_RES_SCLF.filter("[CTRA_INSA_CLCD =='"+$cmb_ctra.getValue()+"'][SCLF_CD == '"+lbl_sclfs.getSclfCd()+"']"); 요약에서 넘길때 넘기는 한개만 표시하는 경우
				$DS_SCRIPT_RES_SCLF.filter("[CTRA_INSA_CLCD =='"+$cmb_ctra.getValue()+"']");
				lbl_sclfs.setItemindex($DS_SCRIPT_RES_SCLF.indexOfRow('SCLF_CD',parent.sclf_cd));
			}
			lbl_sclf_setting();
			highlight_sclfCheck();
			getVrsDetailRes();

		break;

		case "getVrsRes":
			$DS_SCRIPT_RES_COPY.setData(res.DS_SCRIPT_RES.column, res.DS_SCRIPT_RES.record);
			$DS_SCRIPT_RES.setData($DS_SCRIPT_RES_COPY.getColumnInfo(),$DS_SCRIPT_RES_COPY.getData("[CTRA_INSA_CLCD=='"+$cmb_ctra.getValue()+"'][SC_SCLF_CD=='"+lbl_sclfs.getSclfCd()+"']"));
			highlight_multiCheck();
			getVrsDetailStt();

		break;

		case "getDetailStt" :
			$DS_SCRIPT_STT_COPY.setData(res.DS_RES.column, res.DS_RES.record);
			$DS_SCRIPT_STT.setData($DS_SCRIPT_STT_COPY.getColumnInfo(), $DS_SCRIPT_STT_COPY.getData("[CTRA_INSA_CLCD=='"+$cmb_ctra.getValue()+"'][SC_SCLF_CD=='"+lbl_sclfs.getSclfCd()+"']"));
			highlightSelection();
			
		break;
		
		case "btnExcelClick" :
			if(res.DS_RES==undefined){
				xwing.Dialog.alert("출력할 데이터가 없습니다.");
				break;
			}
			
			$DS_EXCEL.clear();
			$DS_EXCEL.setData(res.DS_RES.column, res.DS_RES.record);
			
			if(Xwing.getDataset('DS_EXCEL').size() > 0) {
				Xwing.getDataGrid('grd_excel').exportData('VRS준수결과(전체)', '../jsp/export2.jsp', true); 
			} else {
				xwing.Dialog.alert("출력할 데이터가 없습니다.");
			}
		break;
	}
}
function grd_script_stt_click(event) {
	var nCell = event.cell._getColIndex();

	var selected = document.querySelectorAll("#grd_script_stt .select");
	for(var i=0, len=selected.length; i<len; i ++){
		selected[i].classList.remove("select");
	}

	$("#grd_script_stt .xw-datagrid-area-body table tbody tr[cy='"+event.rowIdx+"']").addClass("select");
	if(nCell == 0){
		rec_key =  $DS_SCRIPT_STT.getValue(event.rowIdx,'UCID');
		call_time = $DS_SCRIPT_STT.getValue(event.rowIdx,'UCID_DATE');
		file_path = $DS_SCRIPT_STT.getValue(event.rowIdx,'FILE_FULL_PATH');
		if(parent.selected_ucid != rec_key){
			parent.load_player(rec_key,call_time,'L', file_path);
			parent.selected_ucid = rec_key;
			parent.cmb_ucid_date_change2(rec_key);
		}
	}else if(nCell == 1){
		var selectedRec = $DS_SCRIPT_STT.getValue(event.rowIdx,'UCID');
		var selectedTime = $DS_SCRIPT_STT.getValue(event.rowIdx,'UCID_DATE');
		var selectedFile =  $DS_SCRIPT_STT.getValue(event.rowIdx,'FILE_FULL_PATH');

		if(parent.selected_ucid != '' && parent.selected_ucid != selectedRec){
			xwing.Dialog.alert("현재 청취하고 계시는 녹취 콜과 다른 콜입니다.\n 좌측의 청취 버튼을 클릭해주세요.");
			return;
		}else{
			var start_point = $DS_SCRIPT_STT.getValue(event.rowIdx,'START_TIME');
			parent.seekToSTT(start_point);
		}
	}
}

function highlightSelection(){
	var idxs = $DS_SCRIPT_STT.searchRow("[QST_CD =='"+$DS_SCRIPT_RES.getValue(0,"QST_CD")+"'][SENT_ID=='"+$DS_SCRIPT_RES.getValue(0,"SENT_ID")+"']");

		for(var i =0; i< idxs.length; i++){
			//$("#grd_script_stt .xw-datagrid-area-body table tbody tr[cy='"+idxs[i]+"']").addClass("select");
			$("#grd_script_stt .xw-datagrid-area-body table tbody tr[cy='"+duplicateIdx[i]+"']").addClass("select");
		}

		$("#grd_script_stt .xw-datagrid-area-body table tbody tr[cy='"+0+"']").removeClass("select");
	}
	
}

function find_duplicates(arr) {
  var len=arr.length,
      out=[],
      counts={};

  for (var i=0;i<len;i++) {
    var item = arr[i];
    counts[item] = counts[item] >= 1 ? counts[item] + 1 : 1;
    if (counts[item] === 2) {
      out.push(item);
    }
  }

  return out;
}

 *************************************************************/
function setColor(cellObj,rowIdx) {
	var val={};

	if(duplicateIdx.length > -1){
		for(var i=0, len=duplicateIdx.length; i<len; i++){

			if(duplicateIdx[i]==rowIdx){
				val['bgcolor'] = "#fff";
			}
		}
	}
	return val;
}

function setColor2(cellObj,rowIdx) {
	var val={};

	if($DS_SCRIPT_STT.getValue(rowIdx-1,"UCID") != $DS_SCRIPT_STT.getValue(rowIdx,"UCID")){
		val['bgimage'] = "../images/icon_notice.png";
		val['bgimagerepeat'] = "no-repeat";
		val['bgimagealign'] = "center center";
	}

	return val;
}

function expr_excel_dateTime(cellObj,rowIdx) {
	var opt = {};
	var dsName="DS_EXCEL";

	var datetime = eval("$"+dsName+".getValue(rowIdx,'UCID_DATE')");
	
	if(datetime == null || datetime == '')
		return opt;
	
	var yyyy = datetime.substr(0,4);
	var MM = datetime.substr(4,2);
	var dd = datetime.substr(6,2);
	var hh =datetime.substr(8,2);
	var mm =datetime.substr(10,2);
	var ss =datetime.substr(12,2);

	opt=yyyy+"-"+MM+"-"+dd+" "+hh+":"+mm+":"+ss;
	return opt;
}
