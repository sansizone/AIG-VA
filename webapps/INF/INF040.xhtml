function f_data_ctrl(strGubun) {
	$edt_code_type.setReadonly(false);
	$edt_code_id.setReadonly(false);
	$edt_code_type.setStyles("edit_mand");
	$edt_code_id.setStyles("edit_mand");
	if (strGubun == "ben_sel_click") {
		$DS_CODETYPE_D.clearData();
		$DS_CODETYPE_D.addRow();
		$DS_CODE.clearData();
		$DS_CODE_D.clearData();
		$DS_CODE_D.addRow();
		$DS_CODE_D.setValue(0, "USE_YN", "Y");
		$DS_PARENT.clearData();
	} else if (strGubun == "grd_codetype_click") {
		$DS_CODE_D.clearData();
		$DS_CODE_D.addRow();
		$DS_CODE_D.setValue(0, "USE_YN", "Y");
		$DS_PARENT.clearData();
		$edt_code_type.setStyles("edit_mand_readonly");
		$edt_code_type.setReadonly(true);
	} else if (strGubun == "btn_reset_click") {
		$DS_CODETYPE_D.clearData();
		$DS_CODETYPE_D.addRow();
		$DS_CODE.clearData();
		$DS_CODE_D.clearData();
		$DS_CODE_D.addRow();
		$DS_CODE_D.setValue(0, "USE_YN", "Y");
		$DS_PARENT.clearData();
	} else if (strGubun == "grd_code_click") {
		$edt_code_type.setStyles("edit_mand_readonly");
		$edt_code_id.setStyles("edit_mand_readonly");
		$edt_code_type.setReadonly(true);
		$edt_code_id.setReadonly(true);
	} else if (strGubun == "btn_reset02_click") {
		$edt_code_type.setStyles("edit_mand_readonly");
		$edt_code_type.setReadonly(true);
		$DS_CODE_D.clearData();
		$DS_CODE_D.addRow();
		$DS_CODE_D.setValue(0, "USE_YN", "Y");
	}
}

function btn_sav_click(event) {
	if (g_isEmpty($edt_code_type.getValue())) {
		return xwing.Dialog.alert("코드타입을 입력해주세요.", $page.getTitle(), function(e) {
			$edt_code_type.focus();
		});
		return false;
	}

	if (g_isEmpty($edt_code_name.getValue())) {
		return xwing.Dialog.alert("코드타입명을 입력해주세요.", $page.getTitle(), function(e) {
			$edt_code_name.focus();
		});
		return false
	}

	var v_mode = ($edt_code_type.getReadonly() ? "U" : "I");
	var v_parent_type = $DS_CODETYPE_D.getValue("PARENT_TYPE");
	xwing.Dialog.confirm(g_decode(v_mode, "I", "등록", "수정") + "하시겠습니까?", $page.getTitle(),
			function(b) {
				if (!b)
					return false;
				$DS_CODETYPE_D.setValue(0, "CODE_ID", "00");
				$DS_CODETYPE_D.setValue(0, "SORT_KEY", "0");
				$DS_CODETYPE_D.setValue(0, "USE_YN", "N");
				$DS_CODETYPE_D.setValue(0, "REG_ID", global("G_USER_ID"));
				$DS_CODETYPE_D.setValue(0, "CHG_ID", global("G_USER_ID"));
				$DS_SCH.setValue(0, "MODULE_TYPE", $DS_COM300.lookUp("CODEID",
						$cmb_module_type.getValue(), "ETC1"));

				var v_param = {
					_sqlName : g_decode(v_mode, "I",
							'wfm.info.inf040.codebook.ins',
							'wfm.info.inf040.codebook.upd')
							+ ",wfm.info.inf040.codetype.sel"
							+ (g_isEmpty(v_parent_type) ? ""
									: ",wfm.info.inf040.parentcode.sel"),
					P_PARENT_TYPE : v_parent_type,
					P_CODE_TYPE : $DS_CODETYPE_D.getValue("CODE_TYPE")
				};

				g_dsToParam("", $DS_CODETYPE_D, 0, v_param);
				g_dsToParam("P_", $DS_SCH, 0, v_param);

				var opt = {
					reqId : "btn_sav_click_" + v_mode,
					url : v_url,
					param : v_param,
					indicator : null,
					showError : true
				};
				Xwing.request(opt, callback);
			});
}

/*********************************************
* SYS020에 우리 서버 정보가 V-WAS-%%로 입력 되어있어야함.
**********************************************/
function btn_refresh_click(event) {

	xwing.Dialog.confirm("코드 초기화 하시겠습니까?", $page.getTitle(), function(e){
		var ds = Xwing.createDataset('ds',[],[[]]);
		ds.setData($DS_SYS020.getColumnInfo(), $DS_SYS020.getData('[CODENAME*="V-WAS"]'));
		
		for ( var i = 0; i < ds.size(); i++) {
			var v_ip = ds.getValue(i, "ETC1");
			//alert(v_ip);
			//var v_ip = $DS_SYS020.getValue(i, "ETC1");

			param = {
					cmd	: "exec"
					,service : 'SVC_MS_020'
					,SERVER_IP	: v_ip
					,SERVER_PORT	: '5292'
					,SERVER_TIMEOUT	: '300000'
				};
			
		
			var opt = {
				reqId		: "btn_refresh_click"+i
				,url		: "service::cs.xcron.control.exe.do"
				,param		: param
				,indicator	: null
				,showError	: true
			};

			Xwing.request(opt, callback);
		}

	});
}

function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '<br/>' + 'ResultMessage : ' + res.ResultMessage);
		return false;
	}
	if (reqId == "f_codebook_sel") {
		$DS_COM300.setData(res.COM300.column, res.COM300.record);
		$DS_COM300.insertRow(0, [ , , '전체', , , , , , , , ]);
		$DS_SYS020.setData(res.SYS020.column, res.SYS020.record);

	} else if (reqId == "f_codetype_sel") {
		$DS_CODETYPE.setData(res.DS_CODETYPE.column, res.DS_CODETYPE.record);
	} else if (reqId == "f_codelist_sel") {
		$DS_CODE.setData(res.DS_CODE.column, res.DS_CODE.record);
		if(!g_isNull(res.DS_PARENT)){
			$DS_PARENT.setData(res.DS_PARENT.column, res.DS_PARENT.record);
			$DS_PARENT.insertRow(0, [ , '선택', , , ]);
		}else{
			$DS_PARENT.clearData();
		}
	} else if (reqId == "btn_sav_click_I") {
		if(!g_isNull(res.DS_PARENT)){
			$DS_PARENT.setData(res.DS_PARENT.column, res.DS_PARENT.record);
			$DS_PARENT.insertRow(0, [ , '선택', , , ]);
		}else{
			$DS_PARENT.clearData();
		}

		$DS_CODETYPE.setData(res.DS_CODETYPE.column, res.DS_CODETYPE.record);
		var v_idx_row = $DS_CODETYPE.indexOfRow("CODE_TYPE", $DS_CODETYPE_D.getValue("CODE_TYPE"));
		if(v_idx_row == -1){
			btn_reset_click();
		}else{
			$DS_CODETYPE.setCursor(v_idx_row);
			$edt_code_type.setStyles("edit_mand_readonly");
			$edt_code_type.setReadonly(true);
		}
		f_stc_ctrl();
	} else if (reqId == "btn_sav_click_U") {
		if(!g_isNull(res.DS_PARENT)){
			$DS_PARENT.setData(res.DS_PARENT.column, res.DS_PARENT.record);
		}else{
			$DS_PARENT.clearData();
		}

		$DS_CODETYPE.setData(res.DS_CODETYPE.column, res.DS_CODETYPE.record);
		var v_idx_row = $DS_CODETYPE.indexOfRow("CODE_TYPE", $DS_CODETYPE_D.getValue("CODE_TYPE"));
		$DS_CODETYPE.setCursor(v_idx_row);
		f_stc_ctrl();
	} else if (reqId == "btn_sav02_click_I") {
		$DS_CODE.setData(res.DS_CODE.column, res.DS_CODE.record);
		var v_idx_row = $DS_CODE.indexOfRow("CODE_ID", $DS_CODE_D.getValue("CODE_ID"));
		if(v_idx_row == -1){
			btn_reset02_click();
		}else{
			$DS_CODE.setCursor(v_idx_row);
			$edt_code_id.setStyles("edit_mand_readonly");
			$edt_code_id.setReadonly(true);
		}
	} else if (reqId == "btn_sav02_click_U") {
		$DS_CODE.setData(res.DS_CODE.column, res.DS_CODE.record);
		var v_idx_row = $DS_CODE.indexOfRow("CODE_ID", $DS_CODE_D.getValue("CODE_ID"));
		$DS_CODE.setCursor(v_idx_row);
	} else if(reqId == "sortInit"){
		//정렬키초기화
		grd_codetype_click();

	} else if(reqId == "sortAuto"){
		//정렬키자동생성
		grd_codetype_click();

	} else if(reqId == "btn_refresh_click0"){
		var hostname = window.location.hostname.split(".");
		if(hostname[0] == "va"){
			v_Rserver1 = true;
		}else{
			xwing.Dialog.alert('서버 코드 초기화가 완료되었습니다.');
			return;
		}
	} else if(reqId == "btn_refresh_click1"){
		if(v_Rserver1){
			xwing.Dialog.alert('1번,2번 서버 코드 초기화가 완료되었습니다.');
			v_Rserver1 = false; //또다시 초기화 하는 경우 위해
			return;
		}else{
			xwing.Dialog.alert('코드 초기화에 실패하였습니다. 오류를 확인해주세요.');
			return;
		}
	} else if(reqId == "btn_del_all_click"){
		grd_codetype_click();
	}
	else{
		
	}
}

	var v_param = {
		_sqlName : "wfm.info.inf040.init.sortkey",
		code_type : codeType
	};

	var opt = {
		reqId : "sortInit",
		url : v_url,
		param : v_param,
		indicator : null,
		showError : true
	};

	Xwing.request(opt, callback);
}
